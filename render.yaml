databases:
  - name: mairie-diagane-db
    plan: free
    databaseName: mairie_diagane
    user: mairie_admin

services:
  - type: web
    name: mairie-diagane-barka
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mairie-diagane-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
